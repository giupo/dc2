[project]
name = "dynacamp"
version = "0.1.0"
description = "Headless dynamic military campaign engine with pluggable game adapters (DCS first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Only needed to generate DCS .miz files (dynacamp build-miz).
miz = ["pydcs"]

[project.scripts]
dynacamp = "dynacamp.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "pytest-xdist>=3.6",
    "pytest-watcher>=0.4",
]
# Sphinx documentation: uv run --group docs sphinx-build -b html docs/sphinx docs/sphinx/_build/html
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
]

# `uv run ptw .`: re-run the tests when a source, test, scenario or the Lua
# bridge changes (editor lock/backup files and the venv/UI excluded).
[tool.pytest-watcher]
now = true
clear = true
delay = 0.5
runner = "pytest"
runner_args = ["-q", "-W", "ignore::SyntaxWarning"]
patterns = ["**/*.py", "**/*.lua", "**/*.toml", "src/**/*.json", "scenarios/**/*.json", "missions/*.miz"]
ignore_patterns = [
    "**/.venv/**", "**/web/**", "**/docs/**", "**/__pycache__/**", "**/.git/**",
    "**/.#*", "**/#*#", "**/*~", "**/flycheck_*", "**/*_flymake.py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynacamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel on every CPU (pytest-xdist); `-n 0` for a serial run (e.g. with pdb).
addopts = "-n auto"
pythonpath = ["src"]
