# Test scenario on the DCS Syria map: one enemy brigade, nothing else.
#
# Purpose: try the player bubble in DCS with any module. Blue has a slot
# squadron for every flyable type of the catalogue, with no aircraft
# (count = 0): the ATO plans nothing, the sky stays empty. Red has one armoured
# brigade (no air defence) south of Khan Shaykhun, ~68 km from Abu al-Duhur,
# 73 km from Bassel Al-Assad and farther from the other bases: outside the
# 60 km air bubble on the ramp, so it materialises in DCS a few minutes after
# take-off (30 km for helicopters). No province has links: the brigade cannot
# move away. Kept out of scenarios/*.toml: the tests of the shipped campaigns
# (roads, AI air order of battle) do not apply to it.
#
#   uv run --extra miz dynacamp build-miz --out-dir missions/dev scenarios/dev/syria_bubble_test.toml
#   uv run dynacamp serve scenarios/dev/syria_bubble_test.toml --compression 1

[campaign]
name = "Syria - Bubble test"
theater = "syria"
date = 2024-06-01
units = "imperial"

[[factions]]
id = "blue"
name = "Test Flight"
coalition = "BLUE"
army = "us"
color = "#4c8dff"
enemies = ["red"]
objectives = []
bullseye = { ll = [35.706252, 36.602944] }

[[factions]]
id = "red"
name = "Target Brigade"
coalition = "RED"
army = "russia"
color = "#ff5a5a"
enemies = ["blue"]
objectives = []
bullseye = { ll = [35.200000, 36.720000] }

