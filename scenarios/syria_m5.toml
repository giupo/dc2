# Fictional scenario on the DCS Syria map: the fight for the M5 corridor.
# Blue holds the north (Aleppo, Idlib, Latakia), Red the south (Damascus, Homs,
# Tartus). The front runs between Khan Shaykhun and Hama; a desert flank opens
# through Ithriyah and the Euphrates crossing at Tabqa.
#
# Coordinates: ll = [lat, lon], WGS84 decimal degrees. The engine projects them
# on the theater plane with DCS' Syria transverse Mercator (dynacamp.projection,
# same parameters as pydcs). Town centres are approximate (~1 km).

[campaign]
name = "Syria - M5 Corridor"
theater = "syria"
units = "imperial"  # briefings and map marks: "imperial" (kts, ft, NM) or "metric"

[[factions]]
id = "blue"
name = "Coalition Task Force"
coalition = "BLUE"  # DCS coalition
army = "us"         # data/catalog/factions.toml
color = "#4c8dff"   # map colour
enemies = ["red"]
objectives = [{ province = "homs", priority = 3 }, { province = "hama", priority = 2 }, { province = "tartus", priority = 2 }]
bullseye = { ll = [35.706252, 34.602944] }

[[factions]]
id = "red"
name = "Southern Army Group"
coalition = "RED"
army = "russia"
color = "#ff5a5a"
enemies = ["blue"]
objectives = [{ province = "aleppo", priority = 3 }, { province = "idlib", priority = 2 }, { province = "latakia", priority = 2 }]
bullseye = { ll = [33.908100, 35.509073] }

