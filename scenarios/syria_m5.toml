# Fictional scenario on the DCS Syria map: the fight for the M5 corridor.
# Blue holds the north (Aleppo, Idlib, Latakia), Red the south (Damascus, Homs,
# Tartus). The front runs between Khan Shaykhun and Hama; a desert flank opens
# through Ithriyah and the Euphrates crossing at Tabqa.
#
# Coordinates: pos = [east, north] in metres = [DCS z, DCS x], computed from
# town lat/lon with tools/dcs_ll.py (Syria transverse Mercator, same parameters
# as pydcs). Town centres are approximate (~1 km).

[campaign]
name = "Syria - M5 Corridor"
theater = "syria"
seed = 11

[[factions]]
id = "blue"
name = "Coalition Task Force"
side = "blue"
enemies = ["red"]
objectives = [{ province = "homs", priority = 3 }, { province = "hama", priority = 2 }, { province = "tartus", priority = 2 }]

[[factions]]
id = "red"
name = "Southern Army Group"
side = "red"
enemies = ["blue"]
objectives = [{ province = "aleppo", priority = 3 }, { province = "idlib", priority = 2 }, { province = "latakia", priority = 2 }]

