# Scenario on the DCS Syria map, after the opening of the October War (6 October
# 1973): the Syrian army attacks the Israeli line on the Golan Heights.
#
# Israel holds the Golan up to the 1967 cease-fire line (the "Purple Line"):
# Quneitra, the Nafah camp, the Hermon outpost and the southern plateau, with
# the Jordan bridges (Bnot Ya'akov) and the Galilee behind. Syria attacks from
# the Sasa line and the Hauran plain, under a dense SAM umbrella (SA-2, SA-3
# and the new, mobile SA-6). Israeli reserves come up from the Galilee.
#
# The order of battle follows the historical one at brigade level, simplified.
# DCS has few period types: the armies of data/catalog/factions.toml (israel,
# syria) use the closest available vehicles, and some aircraft stand in for
# others: Mirage F1 for the Nesher/Shahak, Su-17M4 for the Su-7/Su-20.
#
# Coordinates: ll = [lat, lon], WGS84 decimal degrees, town centres approximate
# (~1 km).

[campaign]
name = "Golan 1973"
theater = "syria"
start_hour = 14  # the attack began at 14:00
units = "metric"  # briefings and map marks: "imperial" (kts, ft, NM) or "metric"

[[factions]]
id = "idf"
name = "IDF Northern Command"
coalition = "BLUE"  # DCS coalition
army = "israel"     # data/catalog/factions.toml
color = "#3b82f6"   # map colour
enemies = ["saa"]
objectives = [{ province = "quneitra", priority = 3 }, { province = "nafah", priority = 2 }, { province = "sasa", priority = 2 }]
bullseye = "rosh_pina"

[[factions]]
id = "saa"
name = "Syrian Arab Army"
coalition = "RED"
army = "syria"
color = "#dc2626"
enemies = ["idf"]
objectives = [{ province = "quneitra", priority = 3 }, { province = "nafah", priority = 3 }, { province = "mount_hermon", priority = 2 }, { province = "bnot_yaakov", priority = 2 }]
bullseye = "kiswe"

