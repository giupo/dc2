# Demo scenario on the DCS Caucasus map.
# Red attacks out of Abkhazia toward Kutaisi; Blue defends and wants Sukhumi.
#
# Coordinates: pos = [east, north] in metres on the theater plane.
# For DCS that is [DCS z, DCS x]. Values were drafted with tools/dcs_ll.py
# (about 1 km accurate here): check them in the mission editor before relying on them.

[campaign]
name = "Western Georgia"
theater = "caucasus"
seed = 7

[[factions]]
id = "blue"
name = "Georgian-Coalition Forces"
side = "blue"
enemies = ["red"]
objectives = [{ province = "sukhumi", priority = 3 }, { province = "ochamchire", priority = 1 }]

[[factions]]
id = "red"
name = "Northern Expeditionary Group"
side = "red"
enemies = ["blue"]
objectives = [{ province = "kutaisi", priority = 3 }, { province = "senaki", priority = 2 }, { province = "poti", priority = 2 }]

