# Demo scenario on the DCS Caucasus map.
# Red attacks out of Abkhazia toward Kutaisi; Blue defends and wants Sukhumi.
#
# Coordinates: ll = [lat, lon], WGS84 decimal degrees, projected by the engine
# with DCS' Caucasus transverse Mercator (dynacamp.projection). Town centres are
# approximate (about 1 km): check them in the mission editor before relying on them.

[campaign]
name = "Western Georgia"
theater = "caucasus"
units = "imperial"  # briefings and map marks: "imperial" (kts, ft, NM) or "metric"

[[factions]]
id = "blue"
name = "Georgian-Coalition Forces"
side = "blue"
enemies = ["red"]
objectives = [{ province = "sukhumi", priority = 3 }, { province = "ochamchire", priority = 1 }]
bullseye = "samtredia"  # BULLS reference: a province (its centre) or [east, north] metres

[[factions]]
id = "red"
name = "Northern Expeditionary Group"
side = "red"
enemies = ["blue"]
objectives = [{ province = "kutaisi", priority = 3 }, { province = "senaki", priority = 2 }, { province = "poti", priority = 2 }]
bullseye = "ochamchire"  # BULLS reference: a province (its centre) or [east, north] metres

