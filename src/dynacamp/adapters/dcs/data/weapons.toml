# How the campaign reads DCS store names (the "name" of a store in DCS' pylon
# tables). `dynacamp loadouts` applies these rules and writes the result next
# to each store in data/loadouts.json (kind, count, range_m): the engine never
# looks at a DCS name. When DCS renames a weapon, fix it here, then run
#
#     uv run --extra miz dynacamp loadouts
#
# Matching is by fragment of the store name, case-sensitive unless noted.

# Training rounds: not counted as missiles.
not_live = ["Captive"]

# Heat seekers, for the merge (within visual range).
wvr = ["AIM-9", "R-60", "R-73", "R-27T", "R-27ET", "R-24T", "RB-74", "Magic", "PL-5", "PL-8", "Python"]

# Self-protection jamming pods (case-insensitive).
jammer = ["ecm", "jamming"]

# Missiles on one pylon: a store named "<n> x <missile>" is a carrier of n.
per_pylon = '(\d+)\s*x\s'

# Radar-guided (beyond visual range) missiles: effective launch range in metres
# against a fighter-sized target, not the brochure figure. The first fragment
# that matches wins.
[bvr_range_m]
"AIM-120" = 50_000
"AIM-54" = 90_000
"AIM-7" = 30_000
"R-77" = 50_000
"R-27ER" = 50_000
"R-27R" = 35_000
"R-33" = 90_000
"R-40" = 30_000
"R-24R" = 25_000
"Super 530" = 30_000
"SD-10" = 50_000
"PL-12" = 50_000

# Anti-radiation missiles (SEAD): effective launch range in metres against a
# SAM radar. The first fragment that matches wins. The Shrike must be fired
# from inside the umbrella of most SAMs it hunts.
[arm_range_m]
"AGM-88" = 60_000
"Kh-58" = 60_000
"Kh-31P" = 60_000
"LD-10" = 60_000
"ALARM" = 45_000
"Kh-25MPU" = 25_000
"AGM-45" = 18_000
