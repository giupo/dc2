# Loadouts composed by `dynacamp loadouts` (and for the mission templates) from
# DCS' per-pylon weapon tables. A recipe fills pylons outside-in with the first
# store matching each pattern, in order. When DCS renames a weapon, fix the
# patterns here, then run
#
#     uv run --extra miz dynacamp loadouts
#
# Patterns are regular expressions on the DCS store name.

# Stores never picked (case-insensitive).
exclude = 'practice|training|inert|dummy|smoke|empty|TsM|M257|M274|M156|illum|ROCKEYE.*training|BDU|SUU-20'

# Campaign aircraft ids loaded with the BOMBER recipe (every station).
bombers = ["b1b", "b52h", "f117", "tu22m3", "tu95ms"]

# Store name patterns, alternatives in order of preference.
[patterns]
a2a_long = 'AIM-120C|AIM-120B|AIM-54C|AIM-54A|R-77|R-33|R-27ER|R-27R|SD-10|Super 530D|AIM-7M|AIM-7F|R-24R|R-40R|Sky Flash|RB-71'
a2a_short = 'AIM-9X|AIM-9M|AIM-9L|AIM-9P5|R-73|R-60|PL-5|Magic|R-550|R-13|R-3S|RB-74|RB-24'
tank = 'Fuel tank|Fuel Tank|PTB|Drop Tank'
pod = 'LITENING|Sniper|AN/AAQ-28|Shkval|Kopyo|ATLIS|Damocles|WMD7|TGM-65'
arm = 'AGM-88C|AGM-88|Kh-58U|Kh-31P|Kh-25MPU|ALARM|LD-10|AGM-45'
pgm_antiarmor = 'AGM-65D|AGM-65H|AGM-65K|AGM-65E|AGM-65F|Kh-25ML|Kh-29L|Kh-29T|S-25L|RB-75|BK-90|AGM-114'
cluster = 'CBU-97|CBU-87|CBU-99|Mk-20|BL755|RBK-500|RBK-250|BetAB|BLG-66'
bomb = 'GBU-12|GBU-38|Mk-82|FAB-250|FAB-500|SAMP-250|Mk-81|OFAB-250'
heavy = 'AGM-86|AGM-154|Kh-65|Kh-555|Kh-101|Kh-22|GBU-31|GBU-27|GBU-10|GBU-24|KAB-1500|KAB-500|BLU-109|Mk-84|FAB-1500|FAB-500|Mk-83|Mk-82|FAB-250|SAB'
rocket = 'S-8KOM|S-8OFP2|M151|S-5KO|S-13|S-24|Zuni|Hydra|SNEB|ARF-8|M261|LAU-61|LAU-68|B-8|UB-32'
jammer_sead = 'ALQ-184|ALQ-131|ALQ-119|SPS-141|Sorbtsiya'
jammer = 'ALQ-131|ALQ-184|ALQ-119|SPS-141'
helo_atgm = 'AGM-114K|AGM-114L|9M114|9M120|Vikhr|TOW|BGM-71|HOT'

# Recipes: [pattern, pylons to fill], in order.
[recipes]
A2A = [["a2a_long", 4], ["a2a_short", 2], ["tank", 1]]
SEAD = [["arm", 2], ["a2a_long", 2], ["a2a_short", 2], ["jammer_sead", 1], ["tank", 1]]
MUD = [["pgm_antiarmor", 2], ["cluster", 2], ["bomb", 2], ["rocket", 2], ["a2a_short", 2], ["jammer", 1], ["pod", 1], ["tank", 1]]
STRIKE = [["heavy", 4], ["a2a_short", 2], ["pod", 1], ["tank", 1]]
BOMBER = [["heavy", 99]]
HELO = [["helo_atgm", 4], ["rocket", 4]]
