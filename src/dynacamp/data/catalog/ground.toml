# Ground forces catalogue: element types and brigade templates.
#
# [elements.<id>]: one kind of combat or support element (a vehicle, or an
# infantry squad of about 10 men).
#   soft_attack   firepower against unarmoured targets
#   hard_attack   firepower against armour
#   defense       attacks it absorbs when defending
#   breakthrough  attacks it absorbs when attacking
#   hardness      0 = soft, 1 = fully armoured
#   combat        false for support elements such as trucks (default true)
#
# [elements.<id>.dcs] is read only by the DCS adapter:
#   ratio         campaign elements one DCS unit stands for
#   (the DCS unit type of each element is per army, in `factions.toml`)
#
# [templates.<id>]: composition and logistics of a brigade type. Scenarios use
# them by id and may add their own ([[templates]] in the scenario).
#   name                 display name
#   elements             nominal element counts
#   speed_kmh            road march speed, km/h
#   supply_capacity      supply points carried (about three days)
#   supply_use_per_hour  consumption at rest

