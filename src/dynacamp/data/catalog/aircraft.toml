# Aircraft catalogue: performance and roles of every campaign aircraft type.
#
# One table per type, keyed by the campaign id used in scenarios
# (`aircraft = "f16c"`). The order of the tables is the catalogue order.
#
#   name        display name
#   cruise_kmh  cruise speed, km/h
#   radius_km   combat radius, km
#   a2a, a2g    air-to-air quality / air-to-ground effectiveness per aircraft
#   tasks       tasks it can fly (CAP ESCORT SEAD STRIKE BAI CAS AWACS TANKER TRANSPORT)
#   helo        rotary wing (default false)
#   cargo       supply points one aircraft airlifts (transports; default 0)
#   alt_m       cruise altitude, m (default 0 = 150 m helicopters, 6000 m jets)
#   radar_km    air-search radar range, km (default: derived from the role)
#   ground_km   range at which pod/eyes find ground units, km (default: derived)
#
# [<id>.dcs] is read only by the DCS adapter:
#   type        DCS unit type (used if the mission has no template group)
#   callsigns   type-specific DCS callsign names after the 8 generic ones, in
#               DCS order (copied from pydcs `callnames`; tests/test_callsigns.py
#               checks them against pydcs)

# ---- core types, both sides

[f16c]
name = "F-16C"
cruise_kmh = 800
radius_km = 550
a2a = 1.0
a2g = 1.0
tasks = ["CAP", "ESCORT", "SEAD", "STRIKE", "BAI", "CAS"]

