# Air defence catalogue: SAM systems and early-warning radars.
#
# One table per system, keyed by the id used in scenarios (`system = "buk"`).
#
#   name             NATO reporting name or common name
#   role             long | medium | short | ewr
#   range_m          engagement range, m
#   detection_m      own radar detection range, m
#   ceiling_m        maximum engagement altitude, m
#   missiles         ready missiles on the launchers
#   pk               nominal single-shot kill probability
#   speed_kmh        road speed, km/h
#   setup_s          time to go into action after moving, s
#   elements         site composition (radar, search_radar, launcher, cp, ...)
#   radar            emits, so anti-radiation missiles can hit it (default true)
#   reload_per_hour  missiles reloaded per hour when supplied (default 4)
#
# [<id>.dcs] is read only by the DCS adapter: site element -> DCS unit type
# (one DCS unit per element).

# ---- long range

[patriot]
name = "Patriot"
role = "long"
range_m = 70_000
detection_m = 160_000
ceiling_m = 24_000
missiles = 16
pk = 0.45
speed_kmh = 40
setup_s = 2700  # 45 min
elements = { radar = 1, launcher = 4, cp = 1, power = 1 }

[patriot.dcs]
radar = "Patriot str"
launcher = "Patriot ln"
cp = "Patriot ECS"
power = "Patriot EPP"

